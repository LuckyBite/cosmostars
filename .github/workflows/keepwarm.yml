name: keep the service warm

# Бесплатный инстанс Render засыпает после 15 минут без входящего трафика и
# просыпается около минуты. Эксперт, открывший ссылку на минуту раньше нашего
# ответа сервиса, просто закроет её, поэтому сервис пингуется каждые десять
# минут. 750 бесплатных инстанс-часов в месяц хватает на круглосуточную работу
# одного сервиса (730 часов).
#
# Включается переменной репозитория SERVICE_URL:
#   Settings → Secrets and variables → Actions → Variables → New variable
#   SERVICE_URL = https://cosmostars.onrender.com
# Пока переменной нет, задача завершается успешно и ничего не делает.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Расписание Actions в бесплатном плане может задерживаться; накапливать
# отложенные запуски незачем — свежий пинг отменяет предыдущий.
concurrency:
  group: keepwarm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: пинг /api/health
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "SERVICE_URL не задан — пинговать нечего, это не ошибка."
            exit 0
          fi
          # Просыпающийся инстанс отвечает не сразу: ждём до двух минут.
          for i in $(seq 1 8); do
            if curl -fsS --max-time 20 "$SERVICE_URL/api/health"; then
              echo
              echo "сервис отвечает"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::$SERVICE_URL не ответил за две минуты"
