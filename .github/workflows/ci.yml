name: checks

# Two things worth knowing before a deadline: the accounting still agrees with
# the reference library, and the image that carries the service to the jury
# still builds. The image is built here and thrown away — publishing is a
# separate, deliberate step (deploy/push-space.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      # The experiment table in the README comes out of this command; if it
      # stops running, the numbers in the README stop being reproducible.
      - run: python -m backend.cli sweep --scenarios P01_intro P02_shift

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cosmostars:ci
      - name: сервис отвечает и раздаёт пульт
        run: |
          docker run -d --name cosmostars -p 7860:7860 cosmostars:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:7860/api/health
          curl -fsS http://127.0.0.1:7860/ | grep -q 'Пульт наземной смены'
          curl -fsS http://127.0.0.1:7860/api/scenarios | grep -q P02_shift
          docker rm -f cosmostars

      # Проверенный образ публикуется, чтобы маленькой машине не пришлось
      # собирать интерфейс самой: сборка хочет около гигабайта памяти.
      # Имя реестра только в нижнем регистре — ghcr.io другого не принимает.
      - name: имя образа
        id: name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.name.outputs.image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.name.outputs.image != ''
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:main
            ${{ steps.name.outputs.image }}:${{ github.sha }}
