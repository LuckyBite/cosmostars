# Развёртывание одним экземпляром на бесплатном инстансе Render.
#
# Чертёж читается кнопкой «New → Blueprint» в панели Render: сервис поднимается
# из этого файла и Dockerfile, без ручной настройки полей.
#
# Почему один экземпляр и почему без диска: смена живёт в памяти процесса, а
# единственный долговечный артефакт — выгрузка, которую оператор скачивает сам.
# Поэтому реплики развели бы запросы одной смены по разным процессам, а
# эфемерная файловая система бесплатного инстанса нам просто безразлична.
#
# Порт: Render передаёт PORT в контейнер, а CMD в Dockerfile его слушает. Ничего
# прописывать не нужно — и нельзя, иначе сервис окажется не на том порту.

services:
  - type: web
    name: cosmostars
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Ближайший к России регион Render: задержка до Благовещенска и Москвы
    # заметно меньше, чем через Орегон.
    region: frankfurt
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # 512 МБ на бесплатном инстансе: полная смена стоит ~17 МБ на суточном
      # сценарии и ~26 МБ на перегруженном, дальше вытесняется давно не
      # открывавшаяся. Двенадцать смен — запас на маршруты жюри и ветвления.
      - key: COSMOSTARS_MAX_RUNS
        value: "12"
